name: Validate repository

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned CI dependencies
        run: python -m pip install -r scripts/requirements-ci.txt
      - name: Validate repository files
        run: python scripts/validate_repository.py
      - name: Run reviewed acceptance checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python skills/github-delivery-verification/scripts/acceptance.py
          python skills/cross-platform-python-runtime-recovery/scripts/acceptance.py
          python skills/python-optional-integration-boundaries/scripts/acceptance.py
          scratch_parent=$(mktemp -d)
          python skills/uv-sync-vs-dev-extras/scripts/acceptance.py "$scratch_parent"
      - name: Run IT contract tests
        run: node skills/it-procedure-builder/scripts/test-contracts.mjs
